# Publica el portafolio en GitHub Pages en cada push a main.
#
# El sitio cuelga de https://<usuario>.github.io/<repo>/, así que la build
# necesita saber esa base o los assets se buscarían en la raíz del dominio.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # `enablement` activa Pages en el repositorio si aún no lo está, con el
      # permiso `pages: write` de arriba. Sin esto el paso falla con un 404 y
      # hay que ir a mano a Settings -> Pages a elegir «GitHub Actions».
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
